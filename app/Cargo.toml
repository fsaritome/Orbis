[package]
name = "orbis"
description = "Orbis desktop app: run photogrammetry scans with the turntable and camera"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
rig = { path = "../rig" }
eframe = { version = "0.37", features = ["persistence"] }
egui = "0.37"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
fuji = { version = "0.1.0", path = "../fuji" }
recon = { path = "../recon" }
serde_json = "1.0.154"
chrono = "0.4.45"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
