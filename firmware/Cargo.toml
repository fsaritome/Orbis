[package]
edition      = "2024"
name         = "orbis-firmware"
rust-version = "1.95"
version      = "0.2.0"

[[bin]]
name = "orbis-firmware"
path = "./src/main.rs"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32", "unstable"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp-alloc", "esp-radio", "esp32"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32"] }
esp-alloc = { version = "0.11.0", features = ["esp32"] }
esp-backtrace = { version = "0.20.0", features = ["esp32", "panic-handler", "println"] }
esp-println = { version = "0.18.0", features = ["esp32"] }
esp-radio = { version = "1.0.0-beta.1", features = ["esp-alloc", "esp32", "unstable", "wifi"] }
esp-storage = { version = "0.10.0", features = ["esp32"] }

embassy-executor = "0.10.0"
embassy-time = "0.5.0"
embassy-sync = "0.8.0"
embassy-futures = "0.1"
embassy-net = { version = "0.9.1", features = ["dhcpv4", "medium-ethernet", "tcp", "udp"] }
embedded-io-async = "0.7.0"

critical-section = "1.2.0"
static_cell = "2.1.1"
libm = "0.2"
postcard = { version = "1", default-features = false }
rig-protocol = { path = "../rig-protocol" }

[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = 'fat'
opt-level     = 's'
